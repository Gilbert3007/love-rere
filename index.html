/* =========================
   LOVE PIXEL
========================= */

.pixel-heart {

    width: 280px;

    height: 240px;

    margin: auto;

    position: relative;

    display: grid;

    grid-template-columns:
    repeat(14, 20px);

    grid-template-rows:
    repeat(12, 20px);

    justify-content: center;

    filter:
    drop-shadow(0 0 10px #ff003c)
    drop-shadow(0 0 25px #ff003c);

    animation: heartbeat 1s infinite;

}


/* BLOK LOVE */

}

@keyframes heartbeat {

    0% {

        transform: scale(1);

    }

    50% {

    }

    100% {

    }

}

}


#yes:hover {

    background: #e6003c;

    transform: scale(1.05);

}


/* NO */

#no {

    background: #333333;

    color: white;

    border-color: #777777;

}


#no:hover {

    background: #555555;

}


/* =========================
   PESAN
========================= */

#message {

    display: none;

    margin-top: 30px;

    font-size: 28px;

    color: #ff1744;

    font-weight: bold;

    text-shadow:
    0 0 5px #ff003c,
    0 0 15px #ff003c;

}


/* =========================
   PIXEL LOVE KECIL
========================= */

.small-heart {

    position: absolute;

    color: #ff1744;

    font-size: 25px;

    animation: floating 5s linear infinite;

}


@keyframes floating {

    from {

        transform:
        translateY(100vh);

    }

    to {

        transform:
        translateY(-100vh);

    }

}


/* =========================
   UNTUK HP
========================= */

@media screen and (max-width: 600px) {

    .pixel-heart {

        transform: scale(0.7);

        margin-bottom: -50px;

    }


    h1 {

        font-size: 28px;

    }


    .question {

        font-size: 30px;

    }


    .subtitle {

        font-size: 15px;

    }


    button {

        font-size: 18px;

        padding: 12px 30px;

    }

}

</style>
