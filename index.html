<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>May I Be Your Boyfriend?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fff0f5, #ffd6e2);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 650px;
    min-height: 450px;
    background: white;
    border-radius: 30px;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    box-shadow: 0 15px 40px rgba(200, 70, 100, 0.25);
}

.question {
    font-size: 45px;
    font-weight: bold;
    color: #54231f;
    line-height: 1.2;
}

.boyfriend {
    margin-top: 10px;
    font-size: 55px;
    font-weight: bold;
    color: #ff5274;
    text-shadow: 3px 3px 0 #6b2929;
}

.heart {
    position: absolute;
    font-size: 40px;
    animation: floating 3s infinite ease-in-out;
}

.heart1 {
    top: 30px;
    left: 30px;
}

.heart2 {
    top: 40px;
    right: 40px;
    animation-delay: 1s;
}

.heart3 {
    bottom: 40px;
    left: 50px;
    animation-delay: 0.5s;
}

.heart4 {
    bottom: 30px;
    right: 40px;
    animation-delay: 1.5s;
}

.heart5 {
    top: 50%;
    left: 15px;
    font-size: 25px;
}

.heart6 {
    top: 50%;
    right: 15px;
    font-size: 25px;
}

@keyframes floating {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

    100% {
        transform: translateY(0);
    }

}

.flying-heart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    animation: fly 7s linear infinite;
}

.fly1 {
    left: 10%;
}

.fly2 {
    left: 30%;
    animation-delay: 2s;
}

.fly3 {
    left: 50%;
    animation-delay: 4s;
}

.fly4 {
    left: 70%;
    animation-delay: 1s;
}

.fly5 {
    left: 90%;
    animation-delay: 3s;
}

@keyframes fly {

    0% {
        transform: translateY(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh);
        opacity: 0;
    }

}

@media (max-width: 500px) {

    .card {
        min-height: 400px;
    }

    .question {
        font-size: 32px;
    }

    .boyfriend {
        font-size: 42px;
    }

    .heart {
        font-size: 30px;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="heart heart1">💗</div>
    <div class="heart heart2">💖</div>
    <div class="heart heart3">💕</div>
    <div class="heart heart4">💗</div>
    <div class="heart heart5">♥</div>
    <div class="heart heart6">♥</div>

    <div>
        <div class="question">
            MAY I BE YOUR
        </div>

        <div class="boyfriend">
            BOYFRIEND?
        </div>
    </div>

</div>

<div class="flying-heart fly1">💗</div>
<div class="flying-heart fly2">💕</div>
<div class="flying-heart fly3">💖</div>
<div class="flying-heart fly4">💗</div>
<div class="flying-heart fly5">💘</div>

</body>
</html>
